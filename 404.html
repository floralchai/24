<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/graphics/sunflower.png">
    <title>Not Found</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            max-width: 100%;
            overflow-x: hidden;
        }
        body {
            min-height: 100vh;
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.75rem;
            background: url("./assets/graphics/bg_note.webp");
            line-height: 1.5;
            color: #604E43;
            font-family: "Times New Roman", "Segoe UI", "Trebuchet MS", sans-serif;
        }
        h1, h2 {
            font-family: "Segoe UI", sans-serif;
            margin: 0.5rem 0;
        }
        a {
            color: gray;
            text-decoration: underline 2px #89CFF0;
        }
        a:hover {
            background-color: azure;
            text-decoration: underline 5px #89CFF0;
        }
        a:visited {
            color: gray;
            text-decoration: underline 2px #89CFF0;
        }
        hr {
            width: 100%;
            max-width: 500px;
            border: none;
            border-top: 2px dotted #604E43;
            margin: 1.5rem 0;
        }
        .bushes {
            border: 2px dotted #604E43;
            max-width: 100%;
            height: auto;
            margin: 1rem auto;
            display: block;
        }
        p {
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0.5rem auto;
        }
        p img {
            vertical-align: middle;
        }
        .green {
            color: #ADD548;
        }
        iframe {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <h2>404 error</h2>
    <img class="bushes" src="./assets/graphics/flower-bushes.jpg" alt="flower bushes">
    <p>
        Page not found? <a href="https://floralchai.github.io/24/">Click here</a> to be back to <span class="green">Floralchai</span>
        <br>
        If you want you can follow me on <a href="https://floralchai.nekoweb.org/not_found.html">Nekoweb</a> <img width="25" src="./assets/graphics/strawberries.png" alt="strawberries icon">
    </p>
    <hr>
</body>
</html>
